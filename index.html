<!doctype html>
<html lang="fr" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RustTerm</title>
    <style>html,body{background:#0B1130;margin:0}</style>
  </head>
  <body spellcheck="false">
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <div class="tb-left" data-tauri-drag-region>
          <div class="traffic" data-tauri-drag-region></div>
          <button id="toggle-sidebar" class="icon-btn"></button>
          <div class="tb-spacer" data-tauri-drag-region></div>
          <button id="add-folder" class="icon-btn"></button>
          <button id="add-host" class="icon-btn"></button>
        </div>
        <div class="tb-mid" data-tauri-drag-region>
          <div id="tabs" role="tablist" data-tauri-drag-region></div>
          <button id="split-h" class="icon-btn"></button>
          <button id="split-v" class="icon-btn"></button>
        </div>
        <div class="tb-right" data-tauri-drag-region>
          <div id="panel-tabs" class="segmented" role="tablist"></div>
          <div class="tb-spacer" data-tauri-drag-region></div>
          <button id="toggle-panel" class="icon-btn"></button>
          <button id="open-settings" class="icon-btn"></button>
        </div>
      </header>
      <aside id="sidebar">
        <div class="search"><input id="host-search" type="search" spellcheck="false" autocorrect="off" autocapitalize="off" /></div>
        <div id="tag-bar"></div>
        <nav id="host-tree"></nav>
      </aside>
      <main id="panes"></main>
      <aside id="panel"><div id="panel-body"></div></aside>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
