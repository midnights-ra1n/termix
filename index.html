<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RustTerm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;800;900&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" aria-label="Hôtes">
        <div class="titlebar" data-tauri-drag-region></div>
        <div class="search">
          <input id="host-search" type="search" placeholder="Rechercher…" aria-label="Rechercher un hôte" spellcheck="false" />
          <button id="add-folder" class="icon-btn" aria-label="Nouveau dossier" title="Nouveau dossier"></button>
          <button id="add-host" class="icon-btn" aria-label="Nouvel hôte" title="Nouvel hôte"></button>
        </div>
        <div id="tag-bar" aria-label="Filtrer par tag"></div>
        <nav id="host-tree"></nav>
      </aside>
      <main id="main">
        <header class="toolbar" data-tauri-drag-region>
          <button id="toggle-sidebar" class="icon-btn" aria-label="Afficher/masquer les hôtes" title="Hôtes"></button>
          <div id="tabs" role="tablist"></div>
          <button id="split-h" class="icon-btn" aria-label="Diviser à droite" title="Diviser à droite"></button>
          <button id="split-v" class="icon-btn" aria-label="Diviser en bas" title="Diviser en bas"></button>
          <button id="toggle-panel" class="icon-btn" aria-label="Afficher/masquer SFTP et stats" title="SFTP et stats"></button>
          <button id="open-settings" class="icon-btn" aria-label="Réglages" title="Réglages"></button>
        </header>
        <div id="panes"></div>
      </main>
      <aside id="panel" aria-label="SFTP et statistiques">
        <div class="titlebar" data-tauri-drag-region></div>
        <div id="panel-tabs" class="segmented" role="tablist"></div>
        <div id="panel-body"></div>
      </aside>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
