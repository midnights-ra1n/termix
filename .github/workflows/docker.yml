# Browser image (noVNC): built per arch on native runners, smoke-tested, then pushed to GHCR for release channels.
name: Docker
on:
  push:
    branches: [nightly, beta, stable]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/termix

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t termix:test .
      - name: Smoke test (web UI answers, app process stays up)
        run: |
          docker run -d --name rt -p 5800:5800 termix:test
          for i in $(seq 30); do curl -fs http://localhost:5800 >/dev/null && break; sleep 2; done
          curl -fs http://localhost:5800 >/dev/null
          sleep 15
          docker exec rt pgrep -x termix || { docker logs rt; exit 1; }
      - if: github.event_name == 'push'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag termix:test "$IMAGE:${{ github.ref_name }}-${{ matrix.arch }}"
          docker push "$IMAGE:${{ github.ref_name }}-${{ matrix.arch }}"

  manifest:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags=(-t "$IMAGE:${{ github.ref_name }}")
          [ "${{ github.ref_name }}" = stable ] && tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" "$IMAGE:${{ github.ref_name }}-amd64" "$IMAGE:${{ github.ref_name }}-arm64"
