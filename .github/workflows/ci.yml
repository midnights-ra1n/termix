name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, nightly, beta, stable]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node scripts/check-i18n.mjs && node scripts/check-suggest.mjs
      - run: pnpm build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml
      # The iOS app shares the backend: it must keep compiling without the desktop-only parts.
      - if: runner.os == 'macOS'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios
      - run: cargo test --manifest-path src-tauri/Cargo.toml
