# One workflow for the three release channels:
#   stable  -> push on `stable`  -> release v<version> (GitHub "latest", used by the stable updater)
#   beta    -> push on `beta`    -> rolling prerelease tagged `beta`
#   nightly -> every day + push on `nightly` -> rolling prerelease tagged `nightly`
# Needs secrets TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD if any).
name: Release
on:
  push:
    branches: [nightly, beta, stable]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.m.outputs.channel }}
      version: ${{ steps.m.outputs.version }}
      tag: ${{ steps.m.outputs.tag }}
      ref: ${{ steps.m.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
          fetch-depth: 0
      - id: m
        shell: bash
        run: |
          channel=${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
          base=$(jq -r .version src-tauri/tauri.conf.json)
          case "$channel" in
            stable) version=$base; tag=v$base ;;
            beta)   version=$base-beta.${{ github.run_number }}; tag=beta ;;
            nightly)
              # Skip the daily build when nothing landed in the last 24 h.
              if [ "${{ github.event_name }}" = schedule ] && [ -z "$(git log --since='24 hours ago' --format=%H -1)" ]; then
                echo "No new commits"; channel=skip
              fi
              version=$base-nightly.$(date -u +%Y%m%d%H%M); tag=nightly ;;
            *) channel=skip ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Reset rolling prerelease
        if: steps.m.outputs.channel == 'beta' || steps.m.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.m.outputs.tag }}" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true

  build:
    needs: meta
    if: needs.meta.outputs.channel != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - uses: ./.github/actions/setup
      - name: Set version
        shell: bash
        run: |
          v='${{ needs.meta.outputs.version }}'
          jq --arg v "$v" '.version = $v' src-tauri/tauri.conf.json > t.json && mv t.json src-tauri/tauri.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.meta.outputs.tag }}
          releaseName: RustTerm ${{ needs.meta.outputs.version }}
          releaseBody: "Canal ${{ needs.meta.outputs.channel }} — commit ${{ needs.meta.outputs.ref }}"
          releaseCommitish: ${{ needs.meta.outputs.ref }}
          prerelease: ${{ needs.meta.outputs.channel != 'stable' }}
          releaseDraft: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
