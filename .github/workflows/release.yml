# Release channels:
#   stable  -> push on `stable`                 -> release v<version> (GitHub "latest", used by the stable updater)
#   beta    -> push on `beta`                   -> rolling prerelease tagged `beta`
#   nightly -> push on `nightly` + every night  -> rolling prerelease tagged `nightly`
# Secret required: TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one).
name: Release
on:
  push:
    branches: [nightly, beta, stable]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.m.outputs.channel }}
      version: ${{ steps.m.outputs.version }}
      tag: ${{ steps.m.outputs.tag }}
      sha: ${{ steps.m.outputs.sha }}
      release_id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
          fetch-depth: 0
      - id: m
        shell: bash
        run: |
          channel="${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}"
          base=$(jq -r .version src-tauri/tauri.conf.json)
          case "$channel" in
            stable)  version="$base"; tag="v$base" ;;
            beta)    version="$base-beta.${{ github.run_number }}"; tag=beta ;;
            nightly) version="$base-nightly.$(date -u +%Y%m%d%H%M)"; tag=nightly
              # The nightly cron only builds when something landed in the last 24 h.
              if [ "${{ github.event_name }}" = schedule ] && [ -z "$(git log --since='24 hours ago' --format=%H -1)" ]; then
                echo "No new commits since yesterday"; channel=skip
              fi ;;
            *) channel=skip ;;
          esac
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - id: r
        if: steps.m.outputs.channel != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.m.outputs.tag }}
          CHANNEL: ${{ steps.m.outputs.channel }}
          VERSION: ${{ steps.m.outputs.version }}
          SHA: ${{ steps.m.outputs.sha }}
        shell: bash
        run: |
          if [ "$CHANNEL" != stable ]; then
            # Rolling prerelease: replace it so the tag points at the new commit.
            gh release delete "$TAG" --cleanup-tag --yes || true
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
            flags=(--prerelease)
          else
            flags=(--latest)
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SHA" --title "RustTerm $VERSION" \
              --notes "Canal $CHANNEL — commit $SHA" "${flags[@]}"
          fi
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.channel != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - os: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
          # shortcut: rpm of nightly/beta carries a "-" in its version (dnf misreads it), fine while those channels are AppImage/deb-first.
          - os: ubuntu-22.04
            args: --bundles deb,appimage,rpm
          - os: ubuntu-22.04-arm
            args: --bundles deb,appimage,rpm
          # NSIS only: MSI (WiX) rejects non-numeric prerelease versions like 0.1.0-nightly.N
          - os: windows-latest
            args: --bundles nsis
          - os: windows-11-arm
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: ./.github/actions/setup
      - name: Set version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # One job writes latest.json once every platform is uploaded (parallel jobs would overwrite each other).
  updater:
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.channel != 'skip' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        shell: bash
        run: |
          mkdir sigs
          gh release download "$TAG" -D sigs -p '*.sig'
          node scripts/updater-json.mjs "$VERSION" "RustTerm $VERSION ($CHANNEL)" sigs "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          gh release upload "$TAG" sigs/latest.json --clobber
