name: Setup
description: Toolchains and system deps for Tauri
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
        targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
    - uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    - shell: bash
      run: pnpm install --frozen-lockfile
