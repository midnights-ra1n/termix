[package]
name = "termix-core"
version = "1.2.1"
edition = "2021"
publish = false
description = "Termix's Rust core (SSH, SFTP, sync) for the native iOS app"

[lib]
crate-type = ["staticlib"]

# Same versions as src-tauri: the modules are shared (see src/lib.rs).
[dependencies]
tauri = { package = "tauri-shim", path = "tauri-shim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
tokio = { version = "1", features = ["full"] }
russh = "0.65"
russh-sftp = "3"
keyring = { version = "3", features = ["apple-native"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
base64 = "0.22"
spake2 = "0.4"
reqwest = { version = "0.13", features = ["json"] }
mdns-sd = "0.22.0"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

# PBKDF2 (600 000 rounds) is unbearably slow unoptimised: keep it fast in debug builds too.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
