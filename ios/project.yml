# Native iOS / iPadOS app: SwiftUI + SwiftTerm over the desktop's Rust core (core/).
# Generate the Xcode project with `xcodegen` in this folder (README → iOS).
name: Termix
options:
  # The UI is written in French: system formatters (sizes, durations, dates) must speak it too, not "GB" / "2 days".
  developmentLanguage: fr
  deploymentTarget:
    iOS: "26.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.99.3
targets:
  Termix:
    type: application
    platform: iOS
    sources:
      - path: Termix
        excludes: [Info.plist]
    dependencies:
      - package: SwiftTerm
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      - name: Rust core
        script: exec "$SRCROOT/core/build.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Termix/Info.plist
      properties:
        CFBundleDisplayName: Termix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # SSH to servers on the local network.
        NSLocalNetworkUsageDescription: Termix se connecte aux serveurs SSH de votre réseau local.
        # SFTP downloads land in Termix's folder of the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: Termix
        PRODUCT_BUNDLE_IDENTIFIER: com.midnights.termix
        MARKETING_VERSION: 1.2.1
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        SWIFT_VERSION: 5.0
        SWIFT_OBJC_BRIDGING_HEADER: Termix/Bridging.h
        LIBRARY_SEARCH_PATHS: $(BUILT_PRODUCTS_DIR)
        OTHER_LDFLAGS: -ltermix_core
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The pre-build script runs cargo, which reads and writes outside the project's declared files.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
