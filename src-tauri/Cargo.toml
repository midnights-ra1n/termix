[package]
name = "termix"
version = "0.2.1"
edition = "2021"
description = "Terminal SSH léger et personnalisable"

[lib]
name = "termix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
tokio = { version = "1", features = ["full"] }
russh = "0.65"
russh-sftp = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tauri-plugin-opener = "2"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
base64 = "0.22"
spake2 = "0.4"
reqwest = { version = "0.13", features = ["json"] }
mdns-sd = "0.22.0"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }

# PBKDF2 (600 000 rounds) is unbearably slow unoptimised: keep it fast in dev builds too.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
