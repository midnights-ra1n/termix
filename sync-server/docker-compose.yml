# Termix sync server. Put it behind HTTPS (Caddy, Traefik, nginx…) before exposing it outside your network.
services:
  termix-sync:
    image: ghcr.io/midnights-ra1n/termix-sync:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TERMIX_ADMIN_USER: admin
      # Leave empty to get a random password printed once in `docker compose logs`.
      TERMIX_ADMIN_PASSWORD: ""
    volumes:
      - termix-sync:/data
volumes:
  termix-sync:
