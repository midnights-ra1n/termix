[package]
name = "termix-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
hex = "0.4.3"
rand = "0.8"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
strip = true
lto = true
